<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1a24" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="{{BESCHREIBUNG}}" />
    {{ROBOTS}}
    <title>{{SEITENTITEL}}</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    {{OPENGRAPH}}
    {{VORLADEN}}
    <style>{{CSS}}</style>
    <script>{{THEME_SOFORT}}</script>
  </head>
  <body>
    <div class="seite">
      <header class="kopf">
        <div class="kopf__text">
          <h1 class="kopf__marke">{{MARKE}}</h1>
          <p class="kopf__tagline">{{TAGLINE}}</p>
        </div>
        <button type="button" class="schalter" aria-label="Design umschalten">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"/></svg>
        </button>
      </header>

      <main>{{INHALT}}</main>

      <footer class="fuss">
        <p>&copy; {{JAHR}} {{TITEL}}</p>
        <p>Keine Cookies, kein Tracking.</p>
        {{FUSS_RECHTLICHES}}
      </footer>
    </div>
    <script>{{THEME}}</script>
  </body>
</html>
